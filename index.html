<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><title>CRNA Hub</title><link rel="manifest" href="manifest.webmanifest"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#152638;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#102a43;color:white;padding:22px 18px}header h1{margin:0;font-size:26px}header p{margin:5px 0 0;color:#c8d7e6}main{max-width:850px;margin:auto;padding:16px}nav{display:flex;gap:7px;overflow:auto;padding-bottom:12px}button{border:0;border-radius:9px;padding:11px 14px;background:#0e7490;color:white;font-weight:650;cursor:pointer}nav button{white-space:nowrap;background:#dbe7ef;color:#183247}nav button.active{background:#102a43;color:white}.panel{background:white;border:1px solid #e0e7ef;border-radius:14px;padding:17px;margin:0 0 15px;box-shadow:0 2px 9px #102a4310}h2{margin:0 0 12px;font-size:20px}h3{margin:16px 0 8px}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #c8d3dd;border-radius:8px;font:inherit}textarea{min-height:80px}form button{margin-top:13px}.item{padding:12px 0;border-bottom:1px solid #e7edf2}.item:last-child{border:0}.muted{color:#657789;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.stat{padding:16px;background:#eaf3f7;border-radius:10px}.stat strong{font-size:23px;display:block}.danger{background:#a32d38;margin-left:8px}.hint{background:#fff6db;padding:12px;border-radius:8px;font-size:13px}footer{padding:20px;text-align:center;color:#607385;font-size:12px}</style></head><body><header><h1>CRNA Hub</h1><p>Your shifts, facilities, income, and credentials in one place</p></header><main><nav id="nav"></nav><div id="app"></div></main><footer>Starter version · Data stored on this device only · Not yet synced with Supabase</footer><script>
const tabs=['Dashboard','Shifts','Facilities','PTO','Credentials','Mileage','Import'];let tab='Dashboard';const key='crna-hub-starter-v1';let db=JSON.parse(localStorage.getItem(key)||'{"shifts":[],"facilities":[],"pto":[],"credentials":[],"mileage":[]}');const save=()=>localStorage.setItem(key,JSON.stringify(db));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('en-US',{style:'currency',currency:'USD'});const el=id=>document.getElementById(id);function render(){el('nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('');let out='';if(tab==='Dashboard'){const total=db.shifts.reduce((s,x)=>s+Number(x.pay||0),0);out=`<section class="panel"><h2>Overview</h2><div class="grid"><div class="stat"><strong>${db.shifts.length}</strong>Scheduled shifts</div><div class="stat"><strong>${money(total)}</strong>Recorded gross pay</div><div class="stat"><strong>${db.facilities.length}</strong>Facilities</div><div class="stat"><strong>${db.credentials.filter(x=>x.expiry&&x.expiry<new Date().toISOString().slice(0,10)).length}</strong>Expired credentials</div></div></section><section class="panel"><h2>Upcoming shifts</h2>${list('shifts',db.shifts.filter(x=>x.date>=new Date().toISOString().slice(0,10)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,8),x=>`${esc(x.date)} · ${esc(x.facility)} · ${esc(x.type)} · ${money(x.pay)}`)}</section>`}
if(tab==='Shifts')out=`<section class="panel"><h2>Add a shift</h2><form onsubmit="add(event,'shifts')"><label>Date</label><input name="date" type="date" required><label>Facility</label><input name="facility" list="facilities" required><datalist id="facilities">${db.facilities.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist><label>Shift type</label><select name="type"><option>8-hour day</option><option>12-hour shift</option><option>24-hour call</option><option>Second call</option><option>Other</option></select><label>Expected pay ($)</label><input name="pay" type="number" min="0" step="0.01" value="0"><button>Add shift</button></form></section><section class="panel"><h2>Saved shifts</h2>${list('shifts',db.shifts.slice().sort((a,b)=>b.date.localeCompare(a.date)),x=>`${esc(x.date)} · ${esc(x.facility)} · ${esc(x.type)} · ${money(x.pay)}`)}</section>`;
if(tab==='Facilities')out=`<section class="panel"><h2>Add a hospital or facility</h2><form onsubmit="add(event,'facilities')"><label>Facility name</label><input name="name" required><label>Address</label><input name="address"><label>Notes (do not store passwords)</label><textarea name="notes" placeholder="Parking, phone numbers, authorized facility codes, EHR URL, procedures"></textarea><button>Save facility</button></form></section><section class="panel"><h2>Facilities</h2>${list('facilities',db.facilities,x=>`<strong>${esc(x.name)}</strong><div class="muted">${esc(x.address)}</div><div style="white-space:pre-wrap">${esc(x.notes)}</div>`)}</section>`;
if(tab==='PTO')out=`<section class="panel"><h2>W-2 PTO ledger</h2><p class="muted">Record accrued or used hours; positive numbers add time and negative numbers deduct time.</p><form onsubmit="add(event,'pto')"><label>Date</label><input name="date" type="date" required><label>Hours (+ accrued / − used)</label><input name="hours" type="number" step="0.25" required><label>Description</label><input name="note"><button>Record PTO</button></form><h3>Current tracked balance: ${db.pto.reduce((s,x)=>s+Number(x.hours),0)} hours</h3></section><section class="panel">${list('pto',db.pto,x=>`${esc(x.date)} · ${esc(x.hours)} hours · ${esc(x.note)}`)}</section>`;
if(tab==='Credentials')out=`<section class="panel"><h2>Credential expirations</h2><form onsubmit="add(event,'credentials')"><label>Credential / license</label><input name="name" required><label>Expiration date</label><input name="expiry" type="date" required><button>Add credential</button></form></section><section class="panel">${list('credentials',db.credentials,x=>`${esc(x.name)} · expires ${esc(x.expiry)}${x.expiry<new Date().toISOString().slice(0,10)?' · EXPIRED':''}`)}</section>`;
if(tab==='Mileage')out=`<section class="panel"><h2>Mileage log</h2><p class="muted">Only log eligible business trips; commuting to a regular workplace is generally not deductible.</p><form onsubmit="add(event,'mileage')"><label>Date</label><input name="date" type="date" required><label>Trip / purpose</label><input name="purpose" required><label>Miles</label><input name="miles" type="number" min="0" step="0.1" required><button>Record trip</button></form><button onclick="csv()">Export mileage CSV</button><h3>Total logged: ${db.mileage.reduce((s,x)=>s+Number(x.miles),0).toFixed(1)} miles</h3></section><section class="panel">${list('mileage',db.mileage,x=>`${esc(x.date)} · ${esc(x.purpose)} · ${esc(x.miles)} miles`)}</section>`;
if(tab==='Import')out=`<section class="panel"><h2>Schedule import</h2><p class="hint">Screenshot/PDF/Excel smart recognition is planned but not yet implemented. Do not upload sensitive employee schedules here.</p><p>For now, paste CSV rows in the format <code>date,facility,shift type,pay</code> (one shift per line).</p><textarea id="csvinput" placeholder="2026-11-05,CAMC,8-hour day,2000"></textarea><button onclick="importRows()">Import CSV rows</button></section><section class="panel"><h2>Backup</h2><button onclick="backup()">Download JSON backup</button><p class="muted">Back up before clearing browser data or switching phones.</p></section>`;
el('app').innerHTML=out}
function list(kind,items,fn){return items.length?items.map(x=>`<div class="item">${fn(x)}<div><button class="danger" onclick="removeItem('${kind}','${x.id}')">Delete</button></div></div>`).join(''):'<p class="muted">Nothing saved yet.</p>'}function add(e,kind){e.preventDefault();const x=Object.fromEntries(new FormData(e.target));x.id=crypto.randomUUID();db[kind].push(x);save();render()}function removeItem(kind,id){if(!confirm('Delete this entry?'))return;db[kind]=db[kind].filter(x=>x.id!==id);save();render()}function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function csv(){download('crna-hub-mileage.csv','date,purpose,miles\n'+db.mileage.map(x=>[x.date,'"'+String(x.purpose).replace(/"/g,'""')+'"',x.miles].join(',')).join('\n'),'text/csv')}function backup(){download('crna-hub-backup.json',JSON.stringify(db,null,2),'application/json')}function importRows(){let rows=el('csvinput').value.trim().split(/\r?\n/),count=0;for(const r of rows){const p=r.split(',');if(p.length<3||!/^\d{4}-\d\d-\d\d$/.test(p[0].trim()))continue;db.shifts.push({id:crypto.randomUUID(),date:p[0].trim(),facility:p[1].trim(),type:p[2].trim(),pay:Number(p[3]||0)});count++}save();alert(count+' shifts imported');render()}render();</script></body></html>
