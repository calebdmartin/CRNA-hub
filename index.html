<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121e53"><meta name="description" content="CRNA Hub scheduling and income dashboard"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="stylesheet" href="styles.css"><title>CRNA Hub</title></head><body><header><div class="brand"><img class="brand-mark" src="brand-icon.svg" alt="CRNA Hub logo" width="48" height="48"><div><h1>CRNA Hub</h1><p class="tagline">Less Admin. More Patient Care.</p><small>Schedule · Income · Facilities</small></div></div><div class="header-right"><span id="storageStatus">Saved on this device</span><button id="profileBtn" class="profile-btn" type="button" aria-label="Your account" title="Your account">👤</button></div></header><main><nav id="nav" aria-label="App sections"></nav><div id="app"></div></main><footer>Tap your profile icon to sign in and sync credentials · No patient data or passwords</footer><script>
// Boot watchdog (Nov 6, 2026): never leave a silent blank page. Capture any
// load error, and if the app has not rendered tabs/content a few seconds
// after load, say so on the page with a reload button. Saved data on this
// device is never touched by this fallback.
window.__crnaBootErrors=[];
window.addEventListener('error',function(e){try{window.__crnaBootErrors.push(String((e.error&&e.error.message)||e.message||'unknown error'))}catch(_){}});
window.__crnaBootWatch=setTimeout(function(){var app=document.getElementById('app'),nav=document.getElementById('nav');var rendered=app&&app.innerHTML.trim().length>0&&nav&&nav.children.length>0;if(rendered)return;var d=document.createElement('section');d.className='panel';d.style.margin='16px auto';d.style.maxWidth='640px';d.innerHTML='<h2>The app didn\u2019t finish loading</h2><p class="muted">Something failed while loading CRNA Hub'+(window.__crnaBootErrors.length?(' \u2014 '+window.__crnaBootErrors[0].replace(/[<>&]/g,'')):'')+'. Tap reload to try again \u2014 your saved data on this device is not affected.</p><p><button type="button" onclick="location.reload()">Reload</button></p>';(app||document.body).appendChild(d)},6000);
</script><script src="supabase-config.js" defer></script><script src="app.js" defer></script><script src="live-sync.js" defer></script></body></html>
